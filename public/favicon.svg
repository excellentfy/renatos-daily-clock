<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradientes 3D para os blocos -->
    <linearGradient id="blockG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blockE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="blockT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Fundo sutil do favicon -->
  <rect width="100" height="100" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Bloco G (Marinho) -->
  <g transform="translate(10, 30)">
    <rect width="24" height="24" rx="6" fill="url(#blockG)" filter="drop-shadow(0px 3px 2px rgba(0,0,0,0.2))"/>
    <text x="12" y="18" fill="#ff2e5f" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">G</text>
  </g>

  <!-- Bloco E (Amarelo) -->
  <g transform="translate(38, 30)">
    <rect width="24" height="24" rx="6" fill="url(#blockE)" filter="drop-shadow(0px 3px 2px rgba(0,0,0,0.25))"/>
    <text x="12" y="18" fill="#ff2e5f" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">E</text>
  </g>

  <!-- Bloco T (Ciano) -->
  <g transform="translate(66, 30)">
    <rect width="24" height="24" rx="6" fill="url(#blockT)" filter="drop-shadow(0px 3px 2px rgba(0,0,0,0.25))"/>
    <text x="12" y="18" fill="#ff2e5f" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">T</text>
  </g>

  <!-- Nome Venezuela simplificado abaixo -->
  <text x="50" y="80" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="11" letter-spacing="1.5" text-anchor="middle">VENEZUELA</text>
</svg>
